name: antigravity_support
description: "Antigravity 2.0 Remote Control Mobile Wrapper"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  mobile_scanner: 5.2.3
  wakelock_plus: 1.2.8
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2
  local_auth: ^2.3.0
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^18.0.0

dependency_overrides:
  package_info_plus: 8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
